[project]
name = "agentic-freelance-advisor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
